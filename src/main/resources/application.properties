spring.application.name=spring_car_rental_system

# spring.datasource.url=jdbc:mysql://${DB_HOST}/car_rental?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Product image uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRE:86400000}

server.forward-headers-strategy=native

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# OAuth2 Client (Google & Facebook Login)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile

# Cloudinary image hosting
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Bakong Configuration
bakong.account-id=${BAKONG_ACCOUNT_ID}
bakong.base-url=${BAKONG_BASE_URL}
bakong.email=${EMAIL}

# CORS allowed origins (comma-separated). Defaults to the local Vite dev server.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Disable DevTools hot-restart (prevents SecurityFilterChain 
# from failing to register during partial classloader reload)
spring.devtools.restart.enabled=false
# logging.level.org.springframework.security=DEBUG


# Telegram login + ngrok dev tunnel (set values in .env)
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
ngrok.enabled=${NGROK_ENABLED:false}
ngrok.authtoken=${NGROK_AUTHTOKEN:}
ngrok.frontend-port=5173
ngrok.domain=${NGROK_DOMAIN:}


# Firebase
firebase.project-id=${FIREBASE_PROJECT_ID}
firebase.client-email=${FIREBASE_CLIENT_EMAIL}
firebase.private-key=${FIREBASE_PRIVATE_KEY}
firebase.private-key-id=${FIREBASE_PRIVATE_KEY_ID}
firebase.client-id=${FIREBASE_CLIENT_ID}

# Hikari Connection Pool
spring.datasource.hikari.max-lifetime=${DB_HIKARI_MAX_LIFETIME}
spring.datasource.hikari.idle-timeout=${DB_HIKARI_IDLE_TIMEOUT}
spring.datasource.hikari.keepalive-time=${DB_HIKARI_KEEPALIVE_TIME}
spring.datasource.hikari.connection-timeout=${DB_HIKARI_CONNECTION_TIMEOUT}